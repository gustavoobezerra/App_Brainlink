plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.brainlink.app"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId "com.brainlink.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        // Versão vinda do pubspec.yaml pelo flutter-gradle-plugin: fixá-la aqui
        // fazia o APK sair sempre como 1.3.0 por mais que o pubspec mudasse.
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
}
